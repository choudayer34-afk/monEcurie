<!doctype html>
<html lang="fr">
<head>

  <button data-v="chevaux" title="Chevaux" aria-label="Chevaux"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V10a7 7 0 0 1 14 0v11h-4V10a3 3 0 0 0-6 0v11z"/></svg></button>
