<!doctype html>
<html lang="fr">
<head>

<title>Écurie</title>

<body>
<header>

<div id="hors" hidden>Hors réseau : tes modifications seront envoyées au retour du réseau.</div>
<main id="vue"></main>
<nav id="nav" hidden>
  <button data-v="accueil" title="Accueil" aria-label="Accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span class="lib">Accueil</span></button>
  <button data-v="soins" title="Santé" aria-label="Santé"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg><span class="lib">Santé</span></button>

  <button data-v="plus" title="Plus" aria-label="Plus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span class="lib">Plus</span></button>
</nav>
<dialog id="dlg"></dialog>
<dialog id="drech"></dialog>
<dialog id="intro"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
